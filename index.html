
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nocturne Cafe Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      /* Custom scrollbar for dark navy theme */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #020617; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155; 
      }
      
      /* Leaflet dark mode overrides */
      .leaflet-container {
        background: #0f172a !important; /* Lighter Slate */
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        height: 100vh !important;
        width: 100vw !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
      }

      /* Blue Tint for the Map Tiles - Lighter Navy Tone */
      .leaflet-tile-pane {
        filter: sepia(50%) hue-rotate(190deg) saturate(300%) brightness(1.3) contrast(1.1);
      }
      
      /* Subtle Under-Glow for Markers (Cyan/Amber/Rose) */
      .marker-glow-green {
        filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.7)); /* Cyan Glow */
      }
      .marker-glow-yellow {
        filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.6)); /* Amber Glow */
      }
      .marker-glow-red {
        filter: drop-shadow(0 0 12px rgba(251, 113, 133, 0.6)); /* Rose Glow */
      }
      
      /* Gradient Text for Logo */
      .logo-gradient {
         fill: url(#logoGrad);
      }
      
      /* Full height layout */
      html, body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      
      #root {
        height: 100vh;
        width: 100vw;
        position: relative;
      }
      
      /* Dapp-kit ConnectButton custom styles - Remove white background */
      .wallet-button-wrapper [data-testid="connect-button"],
      .wallet-button-wrapper button,
      .wallet-button-wrapper [role="button"] {
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        outline: none !important;
      }
      
      /* Remove any white backgrounds from ConnectButton modal/dropdown */
      [data-radix-portal] [role="dialog"],
      [data-radix-portal] [role="menu"],
      [data-radix-portal] > div {
        background: rgba(15, 23, 42, 0.95) !important;
        backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(34, 211, 238, 0.2) !important;
        border-radius: 12px !important;
      }
      
      /* Style wallet list items */
      [data-radix-portal] button,
      [data-radix-portal] [role="menuitem"] {
        background: transparent !important;
        color: #e0f2fe !important;
        border: none !important;
        padding: 12px 16px !important;
        transition: all 0.2s !important;
      }
      
      [data-radix-portal] button:hover,
      [data-radix-portal] [role="menuitem"]:hover {
        background: rgba(34, 211, 238, 0.1) !important;
        color: #ffffff !important;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mysten/dapp-kit@latest/dist/index.css" />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
